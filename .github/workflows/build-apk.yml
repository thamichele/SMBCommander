name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# read-only by default; only the release job below can write
permissions:
  contents: read

# third-party code is pinned to exact commits (tag in the comment): the release job holds the signing key, and a
# moved tag must not be able to run new code next to it
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Test core (SMB and edit sync logic)
        run: ./gradlew --no-daemon :core:test

      # the runner image ships the Android SDK (ANDROID_HOME), missing platforms are fetched by AGP
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # unsigned here: catches release-only problems (lint vital) before they reach main
      - name: Check release build
        run: ./gradlew --no-daemon assembleRelease

      - name: Show APK name, id and version
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"
            "$AAPT2" dump badging "$apk" | grep -E "^(package|application-label|launchable-activity)"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smbcommander-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Builds the signed release APK and publishes it to SMBCommander's own F-Droid repository
  # (branch "fdroid", served at https://raw.githubusercontent.com/thamichele/SMBCommander/fdroid/repo).
  # Needs the repository secrets RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD; skipped without them.
  fdroid:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::notice::Release secrets not set - F-Droid repository not updated"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        if: steps.secrets.outputs.ready == 'true'

      - name: Build release APK
        if: steps.secrets.outputs.ready == 'true'
        run: |
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/release/*.apk | grep -E "^(package|application-label:)"
          VERSION=$("$AAPT2" dump badging app/build/outputs/apk/release/*.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/SMBCommander-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # every build of main becomes a GitHub release with the signed APK attached
      - name: Create GitHub release
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP/SMBCommander-$VERSION.apk" \
            --title "SMBCommander $VERSION" \
            --notes "APK firmato. Gli aggiornamenti arrivano anche dal repository F-Droid https://raw.githubusercontent.com/thamichele/SMBCommander/fdroid/repo"

      - name: Update F-Droid repository
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet fdroidserver==2.4.5
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APP_ID=io.github.thamichele.smbcommander
          VERSION_CODE=$("$AAPT2" dump badging app/build/outputs/apk/release/*.apk | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          mkdir -p fdroid-repo/repo fdroid-repo/metadata/$APP_ID/en-US/changelogs
          cp "$RUNNER_TEMP/release.p12" fdroid-repo/keystore.p12
          # fdroid looks for repo_icon in the working folder and copies it to repo/icons/
          cp fdroid/icon.png fdroid-repo/icon.png
          # store page: name, summary, description, categories and links, plus the app icon
          # (the launcher icon is adaptive, so fdroid cannot take a PNG from the APK)
          cp fdroid/metadata/$APP_ID.yml fdroid-repo/metadata/
          # fdroid shows "what's new" only for a version listed under Builds (never built here: update only indexes the APK)
          cat >> fdroid-repo/metadata/$APP_ID.yml <<METADATA

          Builds:
            - versionName: $VERSION
              versionCode: $VERSION_CODE
              commit: $GITHUB_SHA

          CurrentVersion: $VERSION
          CurrentVersionCode: $VERSION_CODE
          METADATA
          cp fdroid/icon.png fdroid-repo/metadata/$APP_ID/en-US/icon.png
          # "what's new" of this version: the title of the merged pull request
          git log -1 --format=%s | sed 's/ (#[0-9]*)$//' > fdroid-repo/metadata/$APP_ID/en-US/changelogs/$VERSION_CODE.txt
          cp app/build/outputs/apk/release/*.apk fdroid-repo/repo/
          cd fdroid-repo
          cat > config.yml <<CONFIG
          sdk_path: $ANDROID_HOME
          repo_url: https://raw.githubusercontent.com/thamichele/SMBCommander/fdroid/repo
          repo_name: SMBCommander
          repo_description: Repository F-Droid personale di SMBCommander
          repo_icon: icon.png
          archive_older: 0
          keystore: keystore.p12
          repo_keyalias: repo
          keystorepass: $RELEASE_KEYSTORE_PASSWORD
          keypass: $RELEASE_KEYSTORE_PASSWORD
          keydname: CN=SMBCommander F-Droid repo, O=thamichele
          CONFIG
          chmod 600 config.yml
          "$RUNNER_TEMP/venv/bin/fdroid" update --pretty
          echo "== repo fingerprint"
          keytool -list -v -storetype pkcs12 -keystore keystore.p12 -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias repo | grep "SHA256:"

      - name: Publish F-Droid repository
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # only the public repo/ folder is published - never keystore.p12 or config.yml
          mkdir publish && cp -r fdroid-repo/repo publish/repo
          cd publish
          git init -q -b fdroid
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          git commit -q -m "F-Droid repository: SMBCommander build ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" fdroid
        env:
          GH_TOKEN: ${{ github.token }}
